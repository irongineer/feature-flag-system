name: Optimized CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - staging
        - production
      deployment_strategy:
        description: 'Deployment strategy'
        required: false
        default: 'rolling'
        type: choice
        options:
        - rolling
        - blue-green
        - canary
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'

jobs:
  # 	ôúhqÿ
  impact-analysis:
    name: Impact Analysis
    runs-on: ubuntu-latest
    outputs:
      affected-packages: ${{ steps.changes.outputs.changes }}
      deployment-scope: ${{ steps.scope.outputs.scope }}
      risk-level: ${{ steps.risk.outputs.level }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect package changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          list-files: 'json'
          filters: |
            core: 'packages/core/**'
            api: 'packages/api/**'
            admin-ui: 'packages/admin-ui/**'
            cli: 'packages/cli/**'
            sdk: 'packages/sdk/**'
            infrastructure: 'infrastructure/**'

      - name: Calculate deployment scope
        id: scope
        run: |
          if [[ "${{ steps.changes.outputs.core }}" == "true" || "${{ steps.changes.outputs.api }}" == "true" ]]; then
            echo "scope=full" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.changes.outputs.admin-ui }}" == "true" ]]; then
            echo "scope=frontend" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.changes.outputs.infrastructure }}" == "true" ]]; then
            echo "scope=infrastructure" >> $GITHUB_OUTPUT
          else
            echo "scope=minimal" >> $GITHUB_OUTPUT
          fi

      - name: Assess deployment risk
        id: risk
        run: |
          # Risk assessment logic based on changed files and patterns
          RISK_SCORE=0
          
          # High risk patterns
          if [[ "${{ steps.changes.outputs.core }}" == "true" ]]; then
            RISK_SCORE=$((RISK_SCORE + 3))
          fi
          
          if [[ "${{ steps.changes.outputs.api }}" == "true" ]]; then
            RISK_SCORE=$((RISK_SCORE + 2))
          fi
          
          if [[ "${{ steps.changes.outputs.infrastructure }}" == "true" ]]; then
            RISK_SCORE=$((RISK_SCORE + 2))
          fi
          
          # Set risk level
          if [[ $RISK_SCORE -ge 4 ]]; then
            echo "level=high" >> $GITHUB_OUTPUT
          elif [[ $RISK_SCORE -ge 2 ]]; then
            echo "level=medium" >> $GITHUB_OUTPUT
          else
            echo "level=low" >> $GITHUB_OUTPUT
          fi
          
          echo "Risk Score: $RISK_SCORE"
          echo "Deployment Scope: ${{ steps.scope.outputs.scope }}"

  # iÜ„Æ¹ÈŸL
  adaptive-testing:
    name: Adaptive Testing
    runs-on: ubuntu-latest
    needs: impact-analysis
    if: ${{ !inputs.skip_tests }}
    strategy:
      matrix:
        test-type: 
          - unit-affected
          - integration-critical
          - performance-regression
        include:
          - test-type: unit-affected
            scope: ${{ needs.impact-analysis.outputs.affected-packages }}
          - test-type: integration-critical
            scope: api,core
          - test-type: performance-regression
            scope: core,api
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run adaptive tests
        run: |
          case "${{ matrix.test-type }}" in
            "unit-affected")
              # Run tests only for affected packages
              for package in $(echo "${{ matrix.scope }}" | tr ',' ' '); do
                if [[ -d "packages/$package" ]]; then
                  echo "Running tests for affected package: $package"
                  cd packages/$package && npm test && cd ../..
                fi
              done
              ;;
            "integration-critical")
              # Run critical integration tests
              npm run test:integration
              ;;
            "performance-regression")
              # Run performance tests for core components
              npm run poc:performance
              ;;
          esac

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            packages/*/coverage/
            test-results/

  # ‰hjÓëÉhÑÃ±ü¸ó°
  secure-build:
    name: Secure Build & Package
    runs-on: ubuntu-latest
    needs: [impact-analysis, adaptive-testing]
    if: always() && (needs.adaptive-testing.result == 'success' || needs.adaptive-testing.result == 'skipped')
    strategy:
      matrix:
        package: [core, api, cli, sdk, audit-service, admin-ui]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Security scan before build
        run: |
          echo "Running security scans..."
          npm audit --audit-level high
          # Additional security checks

      - name: Build with optimization
        run: |
          # Build core first if needed
          if [[ "${{ matrix.package }}" != "core" ]]; then
            cd packages/core && npm run build && cd ../..
          fi
          
          # Build target package
          cd packages/${{ matrix.package }}
          npm run build
          
          # Verify build output
          if [[ ! -d "dist" ]]; then
            echo "L Build failed - no dist directory"
            exit 1
          fi

      - name: Create deployment artifact
        run: |
          cd packages/${{ matrix.package }}
          mkdir -p ../../dist/${{ matrix.package }}
          cp -r dist/* ../../dist/${{ matrix.package }}/
          cp package.json ../../dist/${{ matrix.package }}/
          
          # Create metadata
          echo "{
            \"package\": \"${{ matrix.package }}\",
            \"version\": \"$(node -p "require('./package.json').version")\",
            \"buildTime\": \"$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)\",
            \"gitSha\": \"${{ github.sha }}\",
            \"gitRef\": \"${{ github.ref }}\"
          }" > ../../dist/${{ matrix.package }}/build-info.json

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-deployment
          path: dist/${{ matrix.package }}
          retention-days: 30

  # µŽ„Ç×í¤ŸL
  deploy-development:
    name: Deploy Development
    runs-on: ubuntu-latest
    needs: [impact-analysis, secure-build]
    if: |
      always() && 
      needs.secure-build.result == 'success' &&
      (github.ref == 'refs/heads/main' || inputs.environment == 'development')
    environment:
      name: development
      url: https://dev-api.feature-flags.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment environment
        run: |
          echo "Deployment Strategy: ${{ inputs.deployment_strategy || 'rolling' }}"
          echo "Risk Level: ${{ needs.impact-analysis.outputs.risk-level }}"
          echo "Scope: ${{ needs.impact-analysis.outputs.deployment-scope }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Pre-deployment health check
        run: |
          echo "Checking current system health..."
          # Health check logic would go here
          echo "System health: OK"

      - name: Deploy with rollback capability
        run: |
          echo "Starting deployment to development..."
          
          # Create deployment snapshot for rollback
          DEPLOYMENT_ID="deploy-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV
          
          # Execute deployment based on strategy
          case "${{ inputs.deployment_strategy || 'rolling' }}" in
            "blue-green")
              echo "Executing blue-green deployment..."
              cd infrastructure && npx cdk deploy --all --context deploymentStrategy=blue-green
              ;;
            "canary")
              echo "Executing canary deployment..."
              cd infrastructure && npx cdk deploy --all --context deploymentStrategy=canary
              ;;
            *)
              echo "Executing rolling deployment..."
              cd infrastructure && npx cdk deploy --all --context environment=development
              ;;
          esac

      - name: Post-deployment verification
        run: |
          echo "Running post-deployment verification..."
          
          # Wait for deployment to stabilize
          sleep 30
          
          # Run smoke tests
          npm run test:smoke || {
            echo "L Smoke tests failed - initiating rollback"
            # Rollback logic would go here
            exit 1
          }
          
          # Verify key metrics
          echo " Deployment verification completed"

      - name: Update deployment status
        run: |
          echo "## =€ Development Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: Development" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy**: ${{ inputs.deployment_strategy || 'rolling' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment ID**: $DEPLOYMENT_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Risk Level**: ${{ needs.impact-analysis.outputs.risk-level }}" >> $GITHUB_STEP_SUMMARY

  # #°ƒÇ×í¤ (Ø¦j‰h_ýØM)
  deploy-production:
    name: Deploy Production (Protected)
    runs-on: ubuntu-latest
    needs: [impact-analysis, deploy-development]
    if: |
      success() && 
      (startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production')
    environment:
      name: production
      url: https://api.feature-flags.example.com
    
    steps:
      - name: Production deployment safety checks
        run: |
          echo "= Production Deployment Safety Protocol Activated"
          echo "Risk Level: ${{ needs.impact-analysis.outputs.risk-level }}"
          
          # High-risk deployments require additional approvals
          if [[ "${{ needs.impact-analysis.outputs.risk-level }}" == "high" ]]; then
            echo "  High-risk deployment detected - Enhanced safety protocols enabled"
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create production backup
        run: |
          echo "Creating production backup..."
          BACKUP_ID="backup-$(date +%Y%m%d-%H%M%S)"
          echo "BACKUP_ID=$BACKUP_ID" >> $GITHUB_ENV
          
          # Create DynamoDB backup
          aws dynamodb create-backup \
            --table-name FeatureFlags \
            --backup-name "$BACKUP_ID-FeatureFlags" || true

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Execute production deployment
        run: |
          echo "=€ Executing production deployment..."
          
          DEPLOYMENT_ID="prod-deploy-$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_ENV
          
          # Always use blue-green for production
          cd infrastructure
          npx cdk deploy --all \
            --context environment=production \
            --context deploymentStrategy=blue-green \
            --require-approval never

      - name: Progressive traffic shifting
        if: needs.impact-analysis.outputs.risk-level == 'high'
        run: |
          echo "High-risk deployment: Progressive traffic shifting enabled"
          
          # Start with 5% traffic
          echo "Shifting 5% traffic to new version..."
          sleep 60
          
          # Monitor metrics and errors
          echo "Monitoring deployment health..."
          sleep 120
          
          # Gradually increase traffic
          for percentage in 25 50 75 100; do
            echo "Shifting ${percentage}% traffic..."
            # Traffic shifting logic would go here
            sleep 90
            
            # Health check
            if ! npm run test:smoke:production; then
              echo "L Health check failed at ${percentage}% - rolling back"
              # Rollback logic
              exit 1
            fi
          done

      - name: Production health monitoring
        run: |
          echo "= Monitoring production health..."
          
          # Extended monitoring for high-risk deployments
          MONITORING_DURATION=300
          if [[ "${{ needs.impact-analysis.outputs.risk-level }}" == "high" ]]; then
            MONITORING_DURATION=600
          fi
          
          echo "Monitoring for ${MONITORING_DURATION} seconds..."
          timeout ${MONITORING_DURATION}s bash -c '
            while true; do
              npm run test:smoke:production
              if [ $? -ne 0 ]; then
                echo "L Production health check failed"
                exit 1
              fi
              echo " Health check passed"
              sleep 30
            done
          '

      - name: Deployment success notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: 'feature-flag-releases'
          SLACK_COLOR: good
          SLACK_MESSAGE: |
            <‰ Production Deployment Successful!
            
            =æ **Deployment**: ${{ env.DEPLOYMENT_ID }}
            <¯ **Strategy**: Blue-Green
            =Ê **Risk Level**: ${{ needs.impact-analysis.outputs.risk-level }}
            = **URL**: https://api.feature-flags.example.com
            
            **Changed Packages**: ${{ needs.impact-analysis.outputs.affected-packages }}
          SLACK_TITLE: 'Feature Flag System - Production Deployment'

  # œ³BêÕíüëÐÃ¯
  emergency-rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    if: failure() && contains(github.workflow, 'production')
    
    steps:
      - name: Execute emergency rollback
        run: |
          echo "=¨ EMERGENCY ROLLBACK INITIATED"
          
          # Immediate rollback to previous version
          # This would typically involve:
          # 1. Switch Lambda aliases to previous version
          # 2. Revert database migrations if needed
          # 3. Update load balancer configurations
          # 4. Restore from backup if necessary
          
          echo "Rollback completed - system restored to previous stable state"

      - name: Emergency notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: 'feature-flag-alerts'
          SLACK_COLOR: danger
          SLACK_MESSAGE: |
            =¨ EMERGENCY ROLLBACK EXECUTED
            
            Production deployment failed and automatic rollback was triggered.
            System has been restored to previous stable state.
            
            Immediate investigation required.
          SLACK_TITLE: 'CRITICAL: Emergency Rollback Executed'

  # Ç×í¤áÈê¯¹ÎÆ
  deployment-metrics:
    name: Collect Deployment Metrics
    runs-on: ubuntu-latest
    needs: [impact-analysis, deploy-development, deploy-production]
    if: always()
    
    steps:
      - name: Calculate deployment metrics
        run: |
          echo "## =Ê Deployment Metrics Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Calculate deployment duration
          START_TIME="${{ github.event.head_commit.timestamp }}"
          END_TIME="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          
          echo "- **Start Time**: $START_TIME" >> $GITHUB_STEP_SUMMARY
          echo "- **End Time**: $END_TIME" >> $GITHUB_STEP_SUMMARY
          echo "- **Risk Level**: ${{ needs.impact-analysis.outputs.risk-level }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Scope**: ${{ needs.impact-analysis.outputs.deployment-scope }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Success Rate**: $(if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then echo "100%"; else echo "Failed"; fi)" >> $GITHUB_STEP_SUMMARY

      - name: Store metrics for analysis
        run: |
          echo "Storing deployment metrics for future optimization..."
          # This would typically store metrics in a time-series database
          # for deployment pipeline optimization analysis