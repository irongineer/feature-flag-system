name: Optimized CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '22'
  CACHE_VERSION: 'v2'

jobs:
  # X¢Âh­ãÃ·ån–™
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.cache-key }}
      affected-packages: ${{ steps.changes.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "cache-key=${{ env.CACHE_VERSION }}-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Detect changed packages
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            core: packages/core/**
            api: packages/api/**
            admin-ui: packages/admin-ui/**
            cli: packages/cli/**
            sdk: packages/sdk/**
            audit-service: packages/audit-service/**

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.cache-keys.outputs.cache-key }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-

  # &ÓëÉÞÈêÃ¯¹
  build-matrix:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        package: [core, api, cli, sdk, audit-service, admin-ui]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Build core (if not core package)
        if: matrix.package != 'core'
        run: cd packages/core && npm run build

      - name: Build ${{ matrix.package }}
        run: |
          cd packages/${{ matrix.package }}
          npm run build

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: packages/${{ matrix.package }}/dist
          key: build-${{ matrix.package }}-${{ github.sha }}

  # ¤óÆê¸§óÈÆ¹ÈŸL
  test-matrix:
    name: Smart Test Execution
    runs-on: ubuntu-latest
    needs: [setup, build-matrix]
    strategy:
      matrix:
        test-group:
          - unit-core
          - unit-api
          - unit-cli
          - unit-sdk
          - unit-audit-service
          - integration-api
          - integration-full
          - performance-core
        include:
          - test-group: unit-core
            package: core
            test-cmd: npm test
          - test-group: unit-api
            package: api
            test-cmd: npm test
          - test-group: unit-cli
            package: cli
            test-cmd: npm test
          - test-group: unit-sdk
            package: sdk
            test-cmd: npm test
          - test-group: unit-audit-service
            package: audit-service
            test-cmd: npm test
          - test-group: integration-api
            package: api
            test-cmd: npm run test:integration
          - test-group: integration-full
            package: "."
            test-cmd: npm run test:integration
          - test-group: performance-core
            package: "."
            test-cmd: npm run poc:performance
      fail-fast: false
    
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore build artifacts
        uses: actions/cache@v3
        with:
          path: packages/*/dist
          key: build-*-${{ github.sha }}
          restore-keys: build-

      - name: Setup test environment
        if: contains(matrix.test-group, 'integration')
        run: |
          # Setup DynamoDB tables for integration tests
          aws dynamodb create-table \
            --endpoint-url http://localhost:8000 \
            --table-name FeatureFlags \
            --billing-mode PAY_PER_REQUEST \
            --key-schema AttributeName=flagKey,KeyType=HASH \
            --attribute-definitions AttributeName=flagKey,AttributeType=S \
            --region ap-northeast-1 || true
        env:
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_DEFAULT_REGION: ap-northeast-1

      - name: Run ${{ matrix.test-group }} tests
        run: |
          if [ "${{ matrix.package }}" = "." ]; then
            ${{ matrix.test-cmd }}
          else
            cd packages/${{ matrix.package }}
            ${{ matrix.test-cmd }}
          fi
        env:
          NODE_ENV: test
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy

      - name: Generate coverage report
        if: startsWith(matrix.test-group, 'unit-')
        run: |
          if [ "${{ matrix.package }}" != "." ]; then
            cd packages/${{ matrix.package }}
            npm run test -- --coverage
          fi

      - name: Upload coverage to Codecov
        if: startsWith(matrix.test-group, 'unit-')
        uses: codecov/codecov-action@v3
        with:
          files: ./packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}-coverage
          fail_ci_if_error: false

  # Áê²üÈqÁ§Ã¯
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [setup, build-matrix, test-matrix]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Restore build artifacts
        uses: actions/cache@v3
        with:
          path: packages/*/dist
          key: build-*-${{ github.sha }}
          restore-keys: build-

      # Code Quality Checks
      - name: ESLint Check
        run: npm run lint
        continue-on-error: false

      - name: Prettier Format Check
        run: npm run format:check
        continue-on-error: false

      - name: TypeScript Type Safety
        run: |
          PACKAGES=("core" "api" "cli" "sdk" "audit-service")
          TYPE_ERRORS=0
          
          for package in "${PACKAGES[@]}"; do
            echo "Checking types in packages/${package}..."
            cd "packages/${package}"
            if ! npx tsc --noEmit --strict; then
              TYPE_ERRORS=$((TYPE_ERRORS + 1))
            fi
            cd ../..
          done
          
          if [ $TYPE_ERRORS -gt 0 ]; then
            echo "L TypeScript type errors found in $TYPE_ERRORS packages"
            exit 1
          fi

      # Security Audits
      - name: NPM Audit
        run: npm audit --audit-level high
        continue-on-error: false

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: false

      # Performance Regression Check
      - name: Performance Regression Detection
        run: |
          npm run poc:performance > performance-current.txt
          
          # Compare with baseline (if available)
          if [ -f "performance-baseline.txt" ]; then
            echo "Comparing performance with baseline..."
            # Add performance comparison logic here
            echo "Performance regression check completed"
          else
            echo "Creating performance baseline..."
            cp performance-current.txt performance-baseline.txt
          fi

  # E2E Æ¹È␀i (aöØMŸL)
  e2e-tests:
    name: E2E Tests (Conditional)
    runs-on: ubuntu-latest
    needs: [setup, quality-gates]
    if: |
      contains(github.event.head_commit.message, '[e2e]') ||
      github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files, 'packages/admin-ui/') ||
      github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.setup.outputs.cache-key }}

      - name: Install Playwright
        run: |
          cd packages/admin-ui
          npx playwright install chromium

      - name: Start API Server
        run: |
          cd packages/api
          NODE_ENV=local npm run dev &
          sleep 10

      - name: Run E2E Tests
        run: |
          cd packages/admin-ui
          npm run test:e2e
        env:
          CI: true

      - name: Upload E2E Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: packages/admin-ui/test-results/

  # CIPœqhìÝüÈ
  ci-summary:
    name: CI Summary & Notifications
    runs-on: ubuntu-latest
    needs: [setup, build-matrix, test-matrix, quality-gates, e2e-tests]
    if: always()
    
    steps:
      - name: Generate CI Summary
        run: |
          echo "## =€ CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setup | ${{ needs.setup.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Matrix | ${{ needs.build-matrix.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Matrix | ${{ needs.test-matrix.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gates | ${{ needs.quality-gates.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          
          # Calculate overall success
          if [[ "${{ needs.quality-gates.result }}" == "success" ]]; then
            echo "##  CI Pipeline Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "## L CI Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Slack Notification (on failure)
        if: failure() && github.ref == 'refs/heads/main'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: 'feature-flag-ci'
          SLACK_COLOR: danger
          SLACK_MESSAGE: 'Optimized CI Pipeline failed on main branch'
          SLACK_TITLE: 'Feature Flag System CI Failure'

      - name: Performance Metrics Collection
        run: |
          echo "Collecting CI performance metrics..."
          # Collect workflow timing data for optimization
          echo "Setup: ${{ needs.setup.result }}"
          echo "Build: ${{ needs.build-matrix.result }}"
          echo "Tests: ${{ needs.test-matrix.result }}"
          echo "Quality: ${{ needs.quality-gates.result }}"